name: Deploy to GitHub Pages

# Obsipix is deployed by Vercel (https://obsipix.vercel.app/), which auto-builds
# every push to main. This workflow is kept for an optional GitHub Pages mirror
# but runs only on manual dispatch — and needs repo Settings ▸ Pages ▸ Source set
# to "GitHub Actions" first, or it fails.
on:
  workflow_dispatch:

# Allow one concurrent deployment; never cancel an in-progress release deploy.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
